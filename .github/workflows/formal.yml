name: formal
# Phase 4 formal proofs (yosys write_smt2 + yosys-smtbmc + z3) - the SymbiYosys engine.
on:
  push:
    paths:
      - "rtl/**"
      - "dv/formal/**"
      - "Makefile"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "rtl/**"
      - "dv/formal/**"
  workflow_dispatch:

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install yosys + z3
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          python -m pip install --upgrade pip
          pip install z3-solver
      - name: make formal
        run: make formal
